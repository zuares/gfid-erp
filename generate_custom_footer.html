<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: white; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .footer-canvas {
            width: 400px;
            height: 90px; /* Keep it compact */
            background: white;
            color: black;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .outer-box {
            border: 2.5px solid black;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .top-section {
            display: flex;
            flex: 1;
            align-items: center;
            padding: 0 10px;
        }
        .smiley-container {
            font-size: 38px;
            line-height: 1;
            margin-right: 12px;
            position: relative;
        }
        .smiley-container::after {
            content: "";
            position: absolute;
            bottom: 4px;
            left: -4px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 10px solid black;
            transform: rotate(45deg);
        }
        
        .text-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .text-content .main-text {
            font-weight: 800;
            font-size: 14px;
            line-height: 1.2;
            letter-spacing: -0.2px;
        }
        
        .text-content .sub-text {
            font-size: 10px;
            font-weight: 600;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .right-section {
            position: relative;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }
        
        .black-pill {
            background-color: black;
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        
        .floating-heart {
            position: absolute;
            top: -12px;
            left: -12px;
            font-size: 14px;
            transform: rotate(-15deg);
        }
        
        .decorative-lines {
            position: absolute;
            top: -10px;
            right: 0;
            display: flex;
            gap: 2px;
        }
        .dec-line {
            width: 2px;
            height: 8px;
            background-color: black;
            border-radius: 2px;
            transform: rotate(30deg);
        }
        
        .bottom-section {
            height: 18px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2px;
        }
        
        .divider-line {
            position: absolute;
            width: 90%;
            height: 1px;
            background-color: black;
            z-index: 1;
        }
        
        .social-text {
            background-color: white;
            z-index: 2;
            padding: 0 8px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="footer-canvas" id="template-11">
        <div class="outer-box">
            <div class="top-section">
                <div class="smiley-container">
                    <i class="fa-regular fa-face-smile"></i>
                </div>
                <div class="text-content">
                    <div class="main-text">
                        Kalau cocok,<br>ceritakan teman mu ya
                    </div>
                    <div class="sub-text">
                        Kalau kurang pas, cerita ke kami yaa <i class="fa-regular fa-comment-dots text-[11px]"></i>
                    </div>
                </div>
                <div class="right-section flex flex-col items-center">
                    <div class="relative">
                        <i class="fa-regular fa-heart floating-heart"></i>
                        <div class="decorative-lines">
                            <div class="dec-line" style="transform: rotate(20deg);"></div>
                            <div class="dec-line" style="transform: rotate(45deg);"></div>
                            <div class="dec-line" style="transform: rotate(70deg);"></div>
                        </div>
                        <div class="black-pill">Cek koleksi lainnya</div>
                    </div>
                    <div class="mt-[6px] flex items-center gap-1 text-[9px] font-bold">
                        <i class="fa-solid fa-globe"></i> www.greatfit.id
                    </div>
                </div>
            </div>
            
            <div class="bottom-section">
                <div class="divider-line"></div>
                <div class="social-text flex items-center justify-center gap-2">
                    <span class="flex items-center gap-1"><i class="fab fa-instagram text-[11px]"></i> greatfit.id</span>
                    <span class="text-gray-400">|</span>
                    <span class="flex items-center gap-1"><i class="fab fa-tiktok text-[11px]"></i> gratfit.id</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
